<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:;"
    />
    <title>Nibble</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="notch.css" />
  </head>
  <body class="collapsed">
    <!-- One silhouette, clipped to a notch-shaped path that grows.
         Everything below is laid out at full size the whole time and simply
         revealed by the shape, so opening never has to lay anything out. -->
    <!-- Sits behind the silhouette, clipped one point larger, so the point
         of it that shows past the black is a hairline along the contour. -->
    <div class="shell-edge" id="shell-edge"></div>

    <div class="shell" id="shell">
      <!-- Level with the menu bar: the only row that exists while closed. -->
      <div class="strip">
        <!-- Shrink-wrapped to its contents, because the island is sized to
             fit this rather than to a fixed width. -->
        <div class="strip-inner">
          <img class="art" id="art" alt="" hidden />
          <span class="dot" id="dot"></span>
          <span class="strip-text" id="lip-text"></span>
        </div>
      </div>

      <div class="panel" id="panel">
        <div class="row">
          <input
            id="q"
            type="search"
            placeholder="Ask your memory…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <ul class="hits" id="hits"></ul>
        <p class="empty" id="empty">Drop text or a file here to remember it.</p>

        <div class="np" id="now" hidden>
          <img class="np-art" id="np-art" alt="" />
          <span class="np-meta">
            <span class="np-title" id="np-title"></span>
            <span class="np-sub" id="np-sub"></span>
          </span>
          <span class="np-eq" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>

        <div class="foot">
          <span id="next">No reminders</span>
          <span class="spacer"></span>
          <button class="ghost" id="pause">Pause</button>
          <button class="ghost" id="open">Open</button>
        </div>
      </div>
    </div>

    <div class="drop" id="drop"><span>Release to remember</span></div>

    <script src="notch.js"></script>
  </body>
</html>
