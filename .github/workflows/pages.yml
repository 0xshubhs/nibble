name: pages

# Builds the site in web/ and publishes it to GitHub Pages.
#
# Manual on purpose: running it makes the page public. Turn Pages on first
# (Settings -> Pages -> Source: GitHub Actions), then run this workflow --
# or add a `push:` trigger here once you want every commit to deploy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build the static export
        # A project site is served from /<repo>, so the base path has to match
        # or every asset 404s. Reading it from the repository name means a
        # fork or a rename keeps working with no edit here.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Stop Pages from running Jekyll over the export
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - id: deploy
        uses: actions/deploy-pages@v4
